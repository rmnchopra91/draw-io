<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Spotify Song Player</title>
        <style>
            body { font-family: Arial, sans-serif; margin: 30px; background: #f9f9f9; }
            h1 { text-align: center; color: #1DB954; }
            .player { text-align: center; margin-bottom: 40px; }
            iframe { border-radius: 10px; width: 300px; height: 380px; border: none; }
            .song-list { max-width: 500px; margin: 0 auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1); }
            .song-item { padding: 12px 20px; cursor: pointer; border-bottom: 1px solid #eee; }
            .song-item:hover { background-color: #f0f0f0; }
        </style>
    </head>
    <body>
        <div class="filter-form" style="max-width: 500px; margin: 0 auto 20px; padding: 10px; background: #fff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1);">
            <form action="/" method="get" style="display: flex; flex-direction: column; gap: 10px;">
                <input type="text" name="artist" placeholder="Artist name" value="{{ request.query_params.get('artist', 'Sumit Goswami') }}">
                <input type="text" name="track" placeholder="Track name" value="{{ request.query_params.get('track', '') }}">
                <input type="text" name="album" placeholder="Album name" value="{{ request.query_params.get('album', '') }}">
                <input type="text" name="genre" placeholder="Genre" value="{{ request.query_params.get('genre', '') }}">
                <button type="submit" style="background: #1DB954; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer;">
                    Search
                </button>
            </form>
        </div>
          
        <h1>Spotify Song Player 🎵</h1>
        <div class="player">
            <h3 id="current-song">
                {% if songs|length > 0 %}
                    ▶️ Now Playing: {{ songs[0].name }} — {{ songs[0].artist }}
                {% else %}
                    Now Playing:
                {% endif %}
            </h3>
            <iframe 
                id="spotifyPlayer" 
                style="border-radius:12px" 
                width="100%" 
                height="152"
                src="{% if songs|length > 0 %}{{ songs[0].embed_url }}{% endif %}"
                frameborder="0" 
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy">
            </iframe>
        </div>
        
        <div class="song-list">
            {% for song in songs %}
              <div class="song-item" onclick="playSong('{{ song.embed_url }}', '{{ song.name }}', '{{ song.artist }}')">
                {{ loop.index }}. {{ song.name }} - {{ song.artist }}
              </div>
            {% endfor %}
        </div>
        
        <script>
            function playSong(embedUrl, title, artist) {
                const player = document.getElementById("spotifyPlayer");
                const currentSong = document.getElementById("current-song");
        
                player.src = embedUrl;  // embed URL now correct
                currentSong.innerText = `▶️ Now Playing: ${title} — ${artist}`;
            }
        </script>
    </body>
</html>
